services:
  conversor:
    build: .
    image: model-converter:1.0.0
    ports:
      - "8080:8080"
    environment:
      MC_DATA_DIR: /data/model-converter
      MC_PORT: "8080"
      MC_WORKERS: "2"
      MC_MAX_UPLOAD_MB: "100"
      MC_JOB_TTL_HOURS: "24"
    volumes:
      - datos-conversor:/data/model-converter
    restart: unless-stopped

volumes:
  datos-conversor:
